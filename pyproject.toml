[project]
name = "automatic-battery-charger"
version = "0.0.1"
description = "Keep the laptop battery inside a healthy band by switching a Tuya WiFi plug locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "battery",
    "home-automation",
    "linux",
    "smart-plug",
    "systemd",
    "tuya",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "tinytuya>=1.20.0",
    "tuya-device-sharing-sdk>=0.2.15",
    # tuya-device-sharing-sdk imports cryptography at runtime but does not
    # declare it as a dependency; without this explicit entry `abc auth`
    # fails with ModuleNotFoundError: No module named 'cryptography'.
    "cryptography>=50.0.2",
    "qrcode>=8.2",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[project.scripts]
abc = "battery_charger.cli:app"

[project.urls]
Homepage = "https://github.com/jfortez/automatic-battery-charger"
Repository = "https://github.com/jfortez/automatic-battery-charger"
Issues = "https://github.com/jfortez/automatic-battery-charger/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_charger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
